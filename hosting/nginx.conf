worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip off;
    gzip_static off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /srv/site;
        # No TLS redirect: the operator's existing tunnel terminates public HTTPS.
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Content-Type-Options nosniff always;
        disable_symlinks on;
        autoindex off;
        error_page 404 = @missing;
        location @missing {
            add_header Cache-Control "no-store, no-transform" always;
            add_header X-Content-Type-Options nosniff always;
            return 404;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /releases { return 404; }
        location = /artifacts { return 404; }
        location /releases/ { return 404; }
        location /artifacts/ { return 404; }
        # Only exact versioned public files get immutable caching, never missing files.
        location ~ "^/releases/[a-z][a-z0-9-]{0,63}/[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}\.json$" {
            root /srv/public;
            types { application/json json; }
            try_files $uri =404;
            max_ranges 0;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ "^/artifacts/[a-z][a-z0-9-]{0,63}/[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}\.zdx$" {
            root /srv/public;
            types { application/zip zdx; }
            try_files $uri =404;
            max_ranges 0;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ /\. { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri /index.html; }
    }
}
