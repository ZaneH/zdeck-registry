services:
  registry:
    build: .
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-1431}:8080"
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700
    volumes:
      - ./data/releases:/srv/public/releases:ro
      - ./data/artifacts:/srv/public/artifacts:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
