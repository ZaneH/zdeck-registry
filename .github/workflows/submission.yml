name: Prepare unsigned plugin submission

on:
  workflow_dispatch:
    inputs:
      submission_commit:
        description: 'Full commit SHA in THIS repository containing submissions/plugin.zdx (no code is run)'
        required: true
        type: string
      source_repo:
        description: 'Public HTTPS source repository URL'
        required: true
        type: string
      source_commit:
        description: 'Full immutable plugin source commit SHA'
        required: true
        type: string
      license:
        description: 'Only if absent from archive package.json (must match LICENSE after review)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate input commit before checkout
        env:
          SUBMISSION_COMMIT: ${{ inputs.submission_commit }}
        run: '[[ "$SUBMISSION_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tools
          persist-credentials: false
      # Only the archive subtree from the maintainer-selected same-repository commit.
      # Never execute a script, action, npm install, or lifecycle from this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.submission_commit }}
          path: input
          sparse-checkout: /submissions/plugin.zdx
          sparse-checkout-cone-mode: false
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Inspect static archive and generate unreviewed bundle
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          LICENSE_ID: ${{ inputs.license }}
        run: |
          python -B tools/scripts/submission.py \
            --archive "$GITHUB_WORKSPACE/input/submissions/plugin.zdx" \
            --source-root "$GITHUB_WORKSPACE/input" \
            --repo "$SOURCE_REPO" --commit "$SOURCE_COMMIT" --license "$LICENSE_ID" \
            --output "$RUNNER_TEMP/submission"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-plugin-submission-${{ github.run_id }}
          path: ${{ runner.temp }}/submission/
          if-no-files-found: error
          retention-days: 7
